name: Withdraw installer-only preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-installer.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  withdraw:
    runs-on: windows-latest
    steps:
      - name: Keep installer preview out of public game releases
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $releases=gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName,isDraft
          if($LASTEXITCODE -ne 0){throw 'Cannot inspect releases'}
          $preview=@($releases | ConvertFrom-Json | Where-Object {$_.tagName -eq 'installer-v0.1.1' -and !$_.isDraft})
          if($preview.Count -gt 0){
            gh release edit installer-v0.1.1 --repo $env:GITHUB_REPOSITORY --draft
            if($LASTEXITCODE -ne 0){throw 'Cannot withdraw installer-only preview'}
          }

# Distribution policy: publish playable game packages only.
